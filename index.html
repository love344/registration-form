<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | Student Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            <div class="logo-icon">🎓</div>

            <div>
                <h2>Student Portal</h2>
                <p>Registration System</p>
            </div>
        </div>

    </header>


    <!-- Main Section -->
    <main class="main">

        <div class="form-container">

            <!-- Form Header -->
            <div class="form-header">

                <div class="student-icon">
                    👤
                </div>

                <div>
                    <h1>Student Registration</h1>

                    <p>
                        Please enter your details to create your student record.
                    </p>
                </div>

            </div>


            <!-- Registration Form -->
            <form id="studentForm">

                <!-- Personal Information -->
                <h3 class="section-title">
                    Personal Information
                </h3>

                <div class="form-grid">

                    <!-- Name -->
                    <div class="form-group">

                        <label for="name">
                            Full Name <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Roll Number -->
                    <div class="form-group">

                        <label for="rollNo">
                            Roll Number <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="rollNo"
                            placeholder="Enter roll number"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address <span>*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="example@gmail.com"
                            required
                        >

                    </div>


                    <!-- Phone -->
                    <div class="form-group">

                        <label for="phone">
                            Phone Number <span>*</span>
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="10-digit mobile number"
                            maxlength="10"
                            required
                        >

                    </div>


                    <!-- DOB -->
                    <div class="form-group">

                        <label for="dob">
                            Date of Birth <span>*</span>
                        </label>

                        <input
                            type="date"
                            id="dob"
                            required
                        >

                    </div>


                    <!-- Gender -->
                    <div class="form-group">

                        <label>
                            Gender <span>*</span>
                        </label>

                        <div class="gender-options">

                            <label class="radio-label">
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Male"
                                    required
                                >
                                Male
                            </label>

                            <label class="radio-label">
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Female"
                                >
                                Female
                            </label>

                            <label class="radio-label">
                                <input
                                    type="radio"
                                    name="gender"
                                    value="Other"
                                >
                                Other
                            </label>

                        </div>

                    </div>

                </div>


                <!-- Academic Information -->
                <h3 class="section-title">
                    Academic Information
                </h3>

                <div class="form-grid">

                    <!-- Course -->
                    <div class="form-group">

                        <label for="course">
                            Course <span>*</span>
                        </label>

                        <select id="course" required>

                            <option value="">
                                Select your course
                            </option>

                            <option value="B.Tech CSE">
                                B.Tech CSE
                            </option>

                            <option value="B.Tech AIML">
                                B.Tech AIML
                            </option>

                            <option value="B.Tech AIDS">
                                B.Tech AIDS
                            </option>

                            <option value="B.Tech CSE DS">
                                B.Tech CSE (DS)
                            </option>

                        </select>

                    </div>


                    <!-- Semester -->
                    <div class="form-group">

                        <label for="semester">
                            Semester <span>*</span>
                        </label>

                        <select id="semester" required>

                            <option value="">
                                Select semester
                            </option>

                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>

                        </select>

                    </div>

                </div>


                <!-- Address -->
                <h3 class="section-title">
                    Contact Information
                </h3>

                <div class="form-group">

                    <label for="address">
                        Address <span>*</span>
                    </label>

                    <textarea
                        id="address"
                        rows="4"
                        placeholder="Enter your complete address"
                        required
                    ></textarea>

                </div>


                <!-- Terms -->
                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">
                        I confirm that the information provided above is correct.
                    </label>

                </div>


                <!-- Buttons -->
                <div class="buttons">

                    <button
                        type="reset"
                        class="reset-btn"
                    >
                        Reset
                    </button>

                    <button
                        type="submit"
                        class="register-btn"
                    >
                        Register Student
                    </button>

                </div>


                <!-- Message -->
                <div id="message"></div>

            </form>

        </div>

    </main>


    <footer>
        <p>© 2026 Student Portal | Student Registration System</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
